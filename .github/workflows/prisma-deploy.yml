name: Prisma Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove auto-generated Prisma config
        run: rm -f prisma.config.js prisma.config.ts prisma.config.mjs

      - name: Prisma Generate
        run: npx prisma generate --schema=prisma/schema.prisma
